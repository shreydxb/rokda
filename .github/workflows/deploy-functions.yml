name: Deploy Edge Functions

# Manual, never automatic. Deploying is a decision about production, and this
# repository's whole deployment-parity apparatus exists because production once
# drifted from main for five days without anyone noticing -- the answer to that
# is to make deploying easy and verifiable, not to make it implicit in a merge.
#
# It exists at all because there was no way to deploy a function except from
# somebody's laptop with a personal access token. That is fine until the person
# holding the token is not the person who needs the deploy.
#
# The CLI deploys from the checkout, which is what applies supabase/config.toml
# -- and that file is the only thing keeping telegram-webhook on
# verify_jwt = false. Deploy it any other way and the gateway 401s every
# Telegram call before the function runs, which looks like a Telegram outage
# rather than a deploy flag.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Which function to deploy (or "all")'
        required: true
        default: all
        type: choice
        options:
          - all
          - telegram-webhook
          - price-refresh
          - fd-accrual

jobs:
  deploy:
    name: deploy ${{ inputs.slug }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Refuse to deploy without credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::No Supabase credentials. Nothing was deployed."
            exit 1
          fi

      - name: Deploy
        run: |
          set -euo pipefail
          if [ "${{ inputs.slug }}" = "all" ]; then
            slugs="telegram-webhook price-refresh fd-accrual"
          else
            slugs="${{ inputs.slug }}"
          fi
          for slug in $slugs; do
            echo "deploying $slug"
            npx --yes supabase functions deploy "$slug" --project-ref "$SUPABASE_PROJECT_REF"
          done

      # The deploy is not the outcome; production running this commit is. This
      # is the same check CI runs on main, so a deploy that half-landed fails
      # here rather than being reported as a success.
      - name: Prove production is now running this commit
        run: npm run verify:functions -- --require-deployed
