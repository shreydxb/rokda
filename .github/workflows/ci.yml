name: CI

on:
  push:
    branches: [main, dev, 'claude/**']
  pull_request:

jobs:
  verify:
    name: install / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Locked install: the tree under test must be the tree the lockfile pins.
      - name: Install (locked)
        run: npm ci

      - name: Lint (application source only)
        run: npm run lint

      - name: Test
        run: npm test

      # The build needs Supabase env vars even to produce a usable artifact:
      # they are inlined at build time, and without them the client's top-level
      # throw folds to a constant and the bundler eliminates the whole app.
      # These are placeholders — CI never talks to a database.
      - name: Build
        run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Verify the build actually contains the application
        run: npm run verify:build

      - name: Report build identity
        run: |
          echo "commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ref: ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"

  # CI was green for five days while telegram-webhook ran an 8 Sep build and
  # main carried two behaviour changes, because nothing here ever looked at
  # what was deployed. This closes that: git SHA -> deployed Edge Function
  # source, both directions.
  edge:
    name: Edge Functions type-check and handler tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Until SHR-303 nothing type-checked these functions: no Deno in any job,
      # and verify:functions compares against the DEPLOYED source rather than
      # validating the repository's. The first check found seven type errors in
      # telegram-webhook, every one from code shipped and reviewed by eye.
      #
      # --node-modules-dir=none: the repository root has a node_modules for the
      # web app, which Deno would otherwise adopt and then fail to resolve the
      # Edge runtime's own npm dependencies from.
      - name: Type-check every Edge Function
        run: |
          for fn in supabase/functions/*/index.ts; do
            echo "deno check $fn"
            deno check --node-modules-dir=none "$fn"
          done

      # Drives the real telegram-webhook handler with only the network faked:
      # database errors on the claim, a crash between claim and capture, a
      # failure after capture, concurrent redelivery, a redelivered goal
      # contribution, and a DNS failure that must not put the bot token in the
      # logs. The claim's atomicity itself is proven against real Postgres in
      # the migrations job.
      - name: Handler tests
        run: >
          deno test --node-modules-dir=none
          --allow-env --allow-read
          --allow-net=api.telegram.org,openrouter.ai,supabase.test
          supabase/functions/telegram-webhook/index.test.ts

  functions:
    name: deployed Edge Functions match this commit
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # On main, a push that changes an Edge Function is being deployed by the
      # Supabase GitHub integration while this job runs. Without a wait the
      # first comparison could read the previous build, turn main red, and keep
      # GitHub Pages a release behind -- it happened for #38 and #40 (SHR-304).
      # The script waits only when the sole failure is a stale deployment AND
      # this commit changed supabase/functions; drift, verify_jwt, an orphan or
      # a function not being served still fail at once. Zero everywhere else.
      AWAIT_DEPLOY_SECONDS: ${{ github.ref == 'refs/heads/main' && '300' || '0' }}
    steps:
      # Depth 2 so the script can see what this commit changed (HEAD~1).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Deployed state is only readable with an access token, and a pull
      # request from a fork never gets one. Rather than let "not checked"
      # quietly read as "no drift" -- the exact way the migration snapshot
      # reported 0 drifting while covering 32 of 38 migrations -- the two
      # cases are separated: on main a missing token FAILS, everywhere else
      # it is an explicit warning that parity was not established.
      # --branch on anything that is not main. A branch that changes a function
      # differs from production by construction and cannot be deployed until it
      # merges, so blocking on that difference makes every such PR permanently
      # red and the check useless as a merge gate. It is still reported, and
      # everything a branch cannot excuse -- an orphan deployment, a function
      # the platform is not serving, verify_jwt disagreeing with config.toml --
      # still blocks here. On main the source difference blocks again, which is
      # where the 8 Sep drift this job exists for actually showed up.
      - name: Compare deployed Edge Functions with this commit
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then BRANCH_FLAG=""; else BRANCH_FLAG="--branch"; fi
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            npm run verify:functions -- $BRANCH_FLAG
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::No Supabase credentials, so deployment parity was not checked. On main that is a failure, not a pass."
            exit 1
          else
            echo "::warning::Deployment parity NOT checked — no Supabase credentials on this ref. This run does not establish that production matches this commit."
            echo "deployment parity: not checked (no credentials on this ref)" >> "$GITHUB_STEP_SUMMARY"
          fi

  migrations:
    name: fresh database from supabase/migrations
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A stock postgres:17 service image has neither pg_cron nor pg_net,
      # both of which the repository's own migrations create extensions for
      # and call directly (cron.schedule/cron.unschedule -- everything else,
      # including every net.http_get/http_post call, only ever appears as
      # text inside a pg_cron job body, never executed at migration-apply
      # time). The real pg_cron also requires shared_preload_libraries and
      # restricts scheduling to one fixed database via cron.database_name --
      # structurally incompatible with this job's per-run throwaway
      # database. Installing Postgres natively (rather than as a Docker
      # service) lets this job drop in supabase/test/fake-extensions'
      # minimal stand-ins before the server ever starts, with no
      # preload/restart dance and no database-name restriction.
      - name: Install PostgreSQL and the pg_cron/pg_net test stubs
        run: |
          sudo systemctl start postgresql.service
          PGVER=$(ls /usr/share/postgresql/)
          sudo cp supabase/test/fake-extensions/*.control supabase/test/fake-extensions/*.sql "/usr/share/postgresql/$PGVER/extension/"
          sudo systemctl restart postgresql.service
          sudo -u postgres psql -c "alter user postgres password 'postgres';"
          pg_isready -h localhost -p 5432 -U postgres

      # Matching table names never proved the applied SQL matched the
      # repository's. This compares normalised SQL, per migration.
      - name: Compare repository migrations with what is applied
        run: npm run compare:migrations

      # Proves a fresh database is buildable from the repository alone.
      - name: Build a fresh database from the migrations
        run: bash scripts/verify-migrations.sh

      - name: Check the behaviour the migrations guarantee
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -q -c 'create database rokda_behaviour;'
          psql -d rokda_behaviour -v ON_ERROR_STOP=1 -q -f supabase/test/platform-shim.sql
          for file in supabase/migrations/*.sql; do
            psql -d rokda_behaviour -v ON_ERROR_STOP=1 -q -f "$file"
          done
          psql -d rokda_behaviour -v ON_ERROR_STOP=1 -f supabase/test/migration-behaviour.test.sql

      # The step above runs as a superuser, which BYPASSES row-level security --
      # it proves constraints and functions and structurally cannot prove a
      # policy. This one sets role to `authenticated` and supplies the JWT
      # claims PostgREST would, so the policies are actually evaluated. Worth
      # having separately: the last-owner trigger passed every superuser test
      # while still letting a signed-in last owner delete themselves.
      - name: Check the row-level security policies as a signed-in user
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -q -c 'create database rokda_rls;'
          psql -d rokda_rls -v ON_ERROR_STOP=1 -q -f supabase/test/platform-shim.sql
          for file in supabase/migrations/*.sql; do
            psql -d rokda_rls -v ON_ERROR_STOP=1 -q -f "$file"
          done
          psql -d rokda_rls -v ON_ERROR_STOP=1 -f supabase/test/rls-policies.test.sql

      # The suites above run one statement at a time, and the bugs this script
      # covers only exist between two of them: under READ COMMITTED, two
      # sessions each removing a DIFFERENT owner both read a snapshot taken
      # before the other committed. scripts/verify-concurrency.sh has existed
      # since that fix and nothing ever ran it, so the regression it guards was
      # unprotected in CI (QA #7).
      - name: Check the concurrent cases the single-session suites cannot reach
        run: npm run verify:concurrency

  # QA #7: everything above answers a question about the REPOSITORY -- do the
  # tests pass, does a fresh database build, does the committed snapshot agree
  # with the committed migrations. None of it can say what production is
  # running, and the two checks that could were each one step short: the
  # migration comparison read a checked-in file that covered 43 of 49
  # migrations, and the function comparison never looked at whether a function
  # was deployed at all or how its JWT verification was configured.
  #
  # This job asks the question the others cannot, against live state fetched
  # fresh, and only where the answer is meaningful: on main, after a deploy.
  # On a branch there is nothing to assert -- production is not supposed to be
  # running that commit yet.
  release:
    name: production matches main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, edge, migrations]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # The ledger is read over a direct connection: the first run of this job
      # got a 403 from the Management API's database-query endpoint, from the
      # same token that lists and downloads Edge Functions without trouble.
      # That grant is account-level and not something this repository controls,
      # and a direct connection is the better transport anyway -- it returns
      # the migration SQL in full, so the content fingerprint keeps meaning
      # something. Same connection string docs/backup-restore.md §3 uses.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Same race as the functions job, and this job starts only ~40s later
      # (SHR-304). It has never lost it, but nothing guarantees the deploy is
      # faster than the jobs this one waits on.
      AWAIT_DEPLOY_SECONDS: '300'
    steps:
      # Depth 2 so verify-function-parity.sh can see what this commit changed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      # No credential fallback here, unlike the functions job: that one runs on
      # every ref including forks, where a missing token is a fact about the
      # ref rather than a fault. This job only ever runs on main, where a
      # missing token means the release was not verified -- and "not checked"
      # reading as "passed" is the exact failure this whole job exists to stop.
      - name: Verify production is running this commit
        run: npm run verify:release
