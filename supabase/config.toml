# Supabase CLI project configuration.
#
# This file exists for one reason that matters: JWT verification per Edge
# Function. Without it, `supabase functions deploy telegram-webhook` deploys
# with verify_jwt defaulting to TRUE, the platform gateway rejects every
# request that has no Authorization header, and Telegram -- which sends
# X-Telegram-Bot-Api-Secret-Token and no JWT -- gets 401ed before the function
# ever runs. The bot stops working, and it looks like a Telegram problem rather
# than a deploy flag.
#
# `--no-verify-jwt` on the command line does the same job, but only for whoever
# remembers to type it. Declaring it here makes the setting part of the
# repository, which is the whole point of the deployment-parity work: production
# configuration should be reproducible from a commit, not from a habit.
project_id = "erggbzbbutsvhleqcddq"

# Authenticated by a shared secret in X-Telegram-Bot-Api-Secret-Token, checked
# in the function before any payload is parsed (and the same boundary guards the
# ?run_recurring_check=1 cron route). It must NOT also require a JWT.
[functions.telegram-webhook]
verify_jwt = false

# Invoked by pg_cron with the vault's scheduler secret in
# X-Rokda-Scheduler-Secret, which is not a JWT, so the gateway must not require
# one. Each function checks the secret itself, in constant time, and refuses
# every scheduled call when it is unset; price-refresh also admits a signed-in
# household member, whose token it checks with the Auth server
# (supabase/functions/_shared/requestAuth.ts, docs/decisions.md). Turning
# verify_jwt back on makes the gateway 401 both nightly jobs.
[functions.price-refresh]
verify_jwt = false

[functions.fd-accrual]
verify_jwt = false

# Sign-ups are closed. Rokda is one household's ledger, and its logins are made
# by hand (dashboard: Authentication -> Users -> Add user). The publishable key
# ships in every build, so with sign-ups open anyone could make a login with
# it, and a login could call create_household().
#
# The hosted project is not known to read this section: the Supabase GitHub
# integration deploys migrations, Edge Functions and storage buckets from this
# repository, and its documentation says it ignores the auth settings. What is
# live is set in the dashboard (docs/environments.md, "Auth settings that live
# in the dashboard"); this records the intended values and applies them to a
# local `supabase start`.
#
# Do not `supabase config push` this to production without reading the diff it
# prints: it sends the whole [auth] section, including defaults for every key
# not written here.
#
# enable_signup here is the project-wide switch that the dashboard's "Allow new
# users to sign up" maps to. [auth.email] has an enable_signup of its own; it
# is not needed and is deliberately left unset.
[auth]
enable_signup = false
# A password-reset link sends someone back to the app's root on whichever
# host they used; a redirect missing from this list is not an error --
# Supabase quietly sends the link to site_url instead. The household's main
# address is its own domain behind Cloudflare Access, which the live dashboard
# names and this public file does not (docs/environments.md). The list stays
# on one line because scripts/compare-functions.mjs reads this file line by
# line.
site_url = "https://rokda-home.pages.dev"
additional_redirect_urls = ["https://rokda-home.pages.dev/**"]
